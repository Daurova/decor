version: '3.8'

services:
  api:
    # Вместо build мы указываем образ, который соберет GitHub Actions
    # Замени ТВОЙ_ЮЗЕР и ТВОЙ_РЕПО на свои данные
    image: ghcr.io/daurova/decor/api:${IMAGE_TAG:-latest}
    ports:
      # ВАЖНО: 127.0.0.1 означает, что порт доступен только внутри сервера.
      # Снаружи (из интернета) будет доступен только через Nginx.
      - "127.0.0.1:4000:4000"
    environment:
      # Тут мы берем переменные из файла .env, который создадим на сервере
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Чтобы данные базы не удалялись при перезапуске контейнера
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: